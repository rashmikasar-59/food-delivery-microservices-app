#Service configuration
spring.application.name=restaurant-service
server.port=0

#Mongodb configuration
spring.data.mongodb.host=${MONGODB_HOST:localhost}
spring.data.mongodb.port=${MONGODB_PORT:27017}
spring.data.mongodb.database=${MONGODB_DATABASE:restaurant-service}

#Eureka Client Configuration
eureka.client.serviceUrl.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka}

#Kafka Properties
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.template.default-topic=order-rest-notification-topic
app.kafka.order-rest-notification-topic=${ORDER_RESTAURANT_TOPIC:order-rest-notification-topic}
spring.kafka.consumer.group-id=restaurant-order-notifications
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.restaurantservice.utils
# Observability / operations
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.description=Food Delivery Microservices
logging.pattern.level=%5p [correlationId:%X{correlationId:-}]

spring.kafka.consumer.properties.spring.json.value.default.type=com.restaurantservice.utils.OrderPlacedNotification
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.auto-offset-reset=earliest
