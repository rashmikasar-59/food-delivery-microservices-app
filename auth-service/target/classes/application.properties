
# Service Configuration
spring.application.name=auth-service
server.port=8081

# Eureka Client Configuration
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka}

# MongoDB Configuration
spring.data.mongodb.host=${MONGODB_HOST:localhost}
spring.data.mongodb.port=${MONGODB_PORT:27017}
spring.data.mongodb.database=${MONGODB_DATABASE:food-delivery-users}

# Observability / Operations
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.description=Food Delivery Microservices
logging.pattern.level=%5p [correlationId:%X{correlationId:-}]

# Kafka Configuration
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
app.kafka.user-registered-topic=${USER_REGISTERED_TOPIC:user-registered-topic}

# Kafka Consumer Configuration
spring.kafka.consumer.group-id=auth-user-sync
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.auth.event
spring.kafka.consumer.properties.spring.json.value.default.type=com.auth.event.UserRegisteredEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false
