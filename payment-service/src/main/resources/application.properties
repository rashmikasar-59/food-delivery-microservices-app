#Service configuration
spring.application.name=payment-service
server.port=0

#Mongodb configuration
spring.data.mongodb.host=${MONGODB_HOST:localhost}
spring.data.mongodb.port=${MONGODB_PORT:27017}
spring.data.mongodb.database=${MONGODB_DATABASE:payment-service}

#Eureka Client Configuration
eureka.client.serviceUrl.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka}

# Kafka Producer Properties
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.template.default-topic=payment-notification-topic
app.kafka.payment-notification-topic=${PAYMENT_NOTIFICATION_TOPIC:payment-notification-topic}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
# Observability / operations
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.description=Food Delivery Microservices
logging.pattern.level=%5p [correlationId:%X{correlationId:-}]

# Outbound request timeout (WebClient)
spring.mvc.async.request-timeout=5s
resilience4j.circuitbreaker.instances.downstreamService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.downstreamService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.downstreamService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.downstreamService.waitDurationInOpenState=10s
resilience4j.retry.instances.downstreamService.maxAttempts=3
resilience4j.retry.instances.downstreamService.waitDuration=500ms

spring.kafka.producer.properties.spring.json.add.type.headers=false
