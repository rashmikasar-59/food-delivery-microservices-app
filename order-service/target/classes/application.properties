#Service configuration
spring.application.name=order-service
server.port=0

#Mongodb configuration
spring.data.mongodb.host=${MONGODB_HOST:localhost}
spring.data.mongodb.port=${MONGODB_PORT:27017}
spring.data.mongodb.database=${MONGODB_DATABASE:order-service}

#Eureka Client Configuration
eureka.client.serviceUrl.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka}

# Kafka Properties
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.template.default-topic=order-rest-notification-topic
app.kafka.order-rest-notification-topic=${ORDER_RESTAURANT_TOPIC:order-rest-notification-topic}
app.kafka.payment-notification-topic=${PAYMENT_NOTIFICATION_TOPIC:payment-notification-topic}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

#Kafka Consumer Properties
spring.kafka.consumer.group-id=order-payment-sync
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
# Observability / operations
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.description=Food Delivery Microservices
logging.pattern.level=%5p [correlationId:%X{correlationId:-}]

# Outbound request timeout (WebClient)
spring.mvc.async.request-timeout=5s
resilience4j.circuitbreaker.instances.downstreamService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.downstreamService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.downstreamService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.downstreamService.waitDurationInOpenState=10s
resilience4j.retry.instances.downstreamService.maxAttempts=3
resilience4j.retry.instances.downstreamService.waitDuration=500ms

spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.properties.spring.json.trusted.packages=com.orderservice.event
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.orderservice.event.PaymentNotificationEvent
spring.kafka.producer.properties.spring.json.add.type.headers=false
